name: Test Firearms Act PDF download

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install 'requests>=2.31,<3'
      - name: Test official Firearms Act PDF endpoint
        run: python test_firearms_pdf.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firearms-pdf-test-report
          path: firearms_pdf_test_report.json
          if-no-files-found: warn
